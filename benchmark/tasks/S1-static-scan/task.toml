schema_version = "1.4"
artifacts = [{ source = "/app/fixture" }, { source = "/app/agent-output" }]
# Harbor task config: dsh plugin migration task S1 (static touchpoint scan, read-only)
[task]
name = "dsh-plugin-upgrade/s1-static-scan"
version = "4.0.0"
description = "Read-only compatibility scan of a legacy dsh 0.1.1 plugin: map all seven touchpoint categories to upgrade cards without modifying the fixture"
keywords = ["dsh", "plugin-migration", "static-analysis", "compat-scan", "harbor"]

[metadata]
difficulty = "medium"
category = "programming"
tags = ["dsh", "plugin-upgrade", "static-scan", "english-prompt"]
execution_contract = "BENCHMARK-AUTH-v1"

[agent]
timeout_sec = 300.0

[verifier]
timeout_sec = 240.0
environment_mode = "separate"
network_mode = "public"

[verifier.env]
REPORT_JUDGE_BASE_URL = "${REPORT_JUDGE_BASE_URL}"
REPORT_JUDGE_MODEL = "${REPORT_JUDGE_MODEL}"
REPORT_JUDGE_API_KEY = "${REPORT_JUDGE_API_KEY}"

[environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096

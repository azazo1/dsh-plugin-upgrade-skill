schema_version = "1.4"
artifacts = [{ source = "/app/fixture" }, { source = "/app/agent-output" }]
# Harbor task config: dsh plugin migration task S3 (snapshot read-surface migration assessment, read-only)
[task]
name = "dsh-plugin-upgrade/s3-snapshot-migration"
version = "4.0.0"
description = "Evaluate a legacy 0.1.1 Web-client plugin's snapshot-read surface: map every breaking touchpoint to upgrade cards without modifying the fixture"
keywords = ["dsh", "plugin-migration", "snapshot", "views", "compat-scan", "harbor"]

[metadata]
difficulty = "medium"
category = "programming"
tags = ["dsh", "plugin-upgrade", "snapshot-migration", "english-prompt"]
execution_contract = "BENCHMARK-AUTH-v1"

[agent]
timeout_sec = 300.0

[verifier]
timeout_sec = 240.0
environment_mode = "separate"
network_mode = "public"

[verifier.env]
REPORT_JUDGE_BASE_URL = "${REPORT_JUDGE_BASE_URL}"
REPORT_JUDGE_MODEL = "${REPORT_JUDGE_MODEL}"
REPORT_JUDGE_API_KEY = "${REPORT_JUDGE_API_KEY}"

[environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096

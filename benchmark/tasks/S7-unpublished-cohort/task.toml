schema_version = "1.4"
artifacts = [{ source = "/app/fixture" }, { source = "/app/agent-output" }]
# Harbor task 配置：dsh 插件迁移考题 S7-unpublished-cohort（静态只读报告题）
[task]
name = "dsh-plugin-upgrade/s7-unpublished-cohort"
version = "4.0.0"
description = "Installation/type-baseline plan for a plugin pinning @deepseek-ai/dsh-llm ^0.1.2-alpha.1 which was never published to npm"
keywords = ["dsh", "plugin-migration", "static-analysis", "read-only", "harbor"]

[metadata]
difficulty = "medium"
category = "programming"
tags = ["dsh", "plugin-upgrade", "static-scan", "chinese-prompt"]

execution_contract = "BENCHMARK-AUTH-v1"

[agent]
timeout_sec = 600.0
network_mode = "no-network"

[verifier]
timeout_sec = 240.0
environment_mode = "separate"
network_mode = "public"

[verifier.env]
REPORT_JUDGE_BASE_URL = "${REPORT_JUDGE_BASE_URL}"
REPORT_JUDGE_MODEL = "${REPORT_JUDGE_MODEL}"
REPORT_JUDGE_API_KEY = "${REPORT_JUDGE_API_KEY}"

[environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096
